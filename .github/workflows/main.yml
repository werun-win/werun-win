name: Windows RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Generate Random Credentials
        run: |
          # Generate random username
          $username = -join ((65..90) + (97..122) | Get-Random -Count 8 | ForEach-Object { [char]$_ })
          
          # Generate random password
          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%'
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          
          # Save to environment variables
          echo "RDP_USERNAME=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host ""
          Write-Host "========================================="
          Write-Host "🔑 AUTO-GENERATED CREDENTIALS"
          Write-Host "========================================="
          Write-Host "👤 Username: $username"
          Write-Host "🔒 Password: $password"
          Write-Host "========================================="

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale.exe"
          Start-Process -FilePath "$env:TEMP\tailscale.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        run: |
          Start-Service Tailscale
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --auth-key="${{ secrets.TAILSCALE_AUTH_KEY }}"

      - name: Enable RDP and Create User
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall add rule name="RDP" dir=in protocol=tcp localport=3389 action=allow
          
          # Create user
          net user "${{ env.RDP_USERNAME }}" "${{ env.RDP_PASSWORD }}" /add
          net localgroup administrators "${{ env.RDP_USERNAME }}" /add
          
          Start-Service TermService -ErrorAction SilentlyContinue

      - name: Get Tailscale IP
        run: |
          $tailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "========================================="
          Write-Host "✅ WINDOWS RDP WITH TAILSCALE READY!"
          Write-Host "========================================="
          Write-Host "🌐 Tailscale IP: $tailscaleIP"
          Write-Host "👤 Username: ${{ env.RDP_USERNAME }}"
          Write-Host "🔒 Password: ${{ env.RDP_PASSWORD }}"
          Write-Host ""
          Write-Host "📱 Connect using Microsoft Remote Desktop:"
          Write-Host "   Address: $tailscaleIP"
          Write-Host "========================================="

      - name: Keep Runner Alive
        run: while ($true) { Start-Sleep -Seconds 300 }
